[workspace]
members = ["crates/calc", "crates/store", "crates/web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
argon2 = "=0.6.0"
axum = "=0.8.9"
axum-login = "=0.18.0"
console_error_panic_hook = "=0.1.7"
email_address = "=0.2.9"
leptos = "=0.8.20"
leptos_axum = "=0.8.10"
leptos_router = "=0.8.15"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
rand = "=0.10.2"
rust_decimal = { version = "=1.43.0", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.8.6", default-features = false }
tokio = "=1.49.0"
tower-sessions = { version = "=0.14.0", features = ["signed"] }
tower-sessions-sqlx-store = "=0.15.0"
tower = { version = "=0.5.3", features = ["util"] }
wasm-bindgen = "=0.2.108"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
